name: Update Code Life Balance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate Code Life Balance report
        uses: alihd-tech/CodeLifeBalance@v1
        with:
          github-token: ${{ secrets.CODE_LIFE_TOKEN }}
          username: alihd-tech
          include-private: "true"
          theme: dark
          card-style: detailed
          formats: svg,markdown
          output-dir: assets
          commit: "true"
